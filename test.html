<!DOCTYPE html>
<script src="customizable-select-polyfill.js"></script>

<style>
table {
  border-collapse: collapse;
  border: 2px solid rgb(140 140 140);
  font-family: sans-serif;
  font-size: 0.8rem;
  letter-spacing: 1px;
}

caption {
  caption-side: bottom;
  padding: 10px;
  font-weight: bold;
}

thead,
tfoot {
  background-color: rgb(228 240 245);
}

th,
td {
  border: 1px solid rgb(160 160 160);
  padding: 8px 10px;
}

td:last-of-type {
  text-align: center;
}

tbody > tr:nth-of-type(even) {
  background-color: rgb(237 238 242);
}

tfoot th {
  text-align: right;
}

tfoot td {
  font-weight: bold;
}

select, ::picker(select) {
  appearance: base-select;
}
</style>

<table>
  <thead>
    <tr>
      <td>native</td>
      <td>polyfill</td>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>
        <select>
          <option>one</option>
          <option>two</option>
        </select>
      </td>
      <td>
        <customizable-select-polyfill>
          <customizable-select-polyfill-option>one</customizable-select-polyfill-option>
          <customizable-select-polyfill-option>two</customizable-select-polyfill-option>
        </customizable-select-polyfill>
      </td>
    </tr>
  </tbody>
</table>
