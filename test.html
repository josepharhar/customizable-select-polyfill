<!DOCTYPE html>
<script src="customizable-select-polyfill.js"></script>
<link rel=stylesheet href="customizable-select-polyfill.css">

<style>
table {
  border-collapse: collapse;
  border: 2px solid rgb(140 140 140);
  font-family: sans-serif;
  font-size: 0.8rem;
  letter-spacing: 1px;
}

thead, tfoot {
  background-color: rgb(228 240 245);
}

th, td {
  border: 1px solid rgb(160 160 160);
  padding: 8px 10px;
}

td:last-of-type {
  text-align: center;
}

tfoot th {
  text-align: right;
}

tfoot td {
  font-weight: bold;
}

select, ::picker(select) {
  appearance: base-select;
}
</style>

<table>
  <thead>
    <tr>
      <td>native</td>
      <td>polyfill</td>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>
        <select>
          <option>one</option>
          <option>two</option>
        </select>
      </td>
      <td>
        <customizable-select-polyfill>
          <customizable-select-polyfill-option>one</customizable-select-polyfill-option>
          <customizable-select-polyfill-option>two</customizable-select-polyfill-option>
        </customizable-select-polyfill>
      </td>
    </tr>

    <tr class=twitter>
      <td>
				<select aria-label=Month>
					<button>
						<div>
							<div class=label aria-hidden=true>Month</div>
							<selectedcontent></selectedcontent>
						</div>
					</button>
					<option>January</option>
					<option>February</option>
					<option>March</option>
					<option>April</option>
				</select>
      </td>
      <td>
				<customizable-select-polyfill aria-label=Month>
					<button>
						<div>
							<div class=label aria-hidden=true>Month</div>
							<customizable-select-polyfill-selectedcontent></customizable-select-polyfill-selectedcontent>
						</div>
					</button>
					<customizable-select-polyfill-option>January</customizable-select-polyfill-option>
					<customizable-select-polyfill-option>February</customizable-select-polyfill-option>
					<customizable-select-polyfill-option>March</customizable-select-polyfill-option>
					<customizable-select-polyfill-option>April</customizable-select-polyfill-option>
				</customizable-select-polyfill>
      </td>
    </tr>
  </tbody>
</table>

<style>
.twitter {
  font-family: system-ui;
  font-size: 18px;
  --accent-color: rgb(29, 155, 240);
}
.twitter,
.twitter ::picker(select),
.twitter ::part(picker) {
  background-color: black;
  color: white;
}
.twitter select,
.twitter ::picker(select),
.twitter customizable-select-polyfill,
.twitter ::part(picker) {
  appearance: base-select;
  border-color: var(--accent-color);
}
.twitter select,
.twitter customizable-select-polyfill {
  width: 170px;
}
.twitter .label {
  font-size: 14px;
  color: var(--accent-color);
}
.twitter ::picker-icon,
.twitter customizable-select-polyfill::after {
  content: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScyZW0nIGhlaWdodD0nMmVtJyB2aWV3Qm94PScwIDAgMjQgMjQnPjxwYXRoIGZpbGw9J3JnYigyOSwgMTU1LCAyNDApJyBkPSdNNy40MSA4LjU5TDEyIDEzLjE3bDQuNTktNC41OEwxOCAxMGwtNiA2bC02LTZ6Jy8+PC9zdmc+");
}
.twitter ::checkmark,
.twitter customizable-select-polyfill-option::before {
  color: var(--accent-color);
}
</style>
