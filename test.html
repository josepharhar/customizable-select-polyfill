<style>

  letter-spacing: 1px;
}

thead, tfoot {
  background-color: rgb(228 240 245);
}

th, td {
  border: 1px solid rgb(160 160 160);
  padding: 8px 10px;
}

td:last-of-type {
  text-align: center;
}

tfoot th {
  text-align: right;
}

tfoot td {
  font-weight: bold;
}

select, ::picker(select) {
  appearance: base-select;
}
</style>

  font-size: 18px;

}
.twitter,
.twitter ::picker(select),
.twitter ::part(picker) {
  background-color: black;
  color: white;
}
.twitter select,
.twitter ::picker(select),
.twitter customizable-select-polyfill,
.twitter ::part(picker) {
  appearance: base-select;
  border-color: var(--accent-color);
}
.twitter select,
.twitter customizable-select-polyfill {
  width: 170px;
}
.twitter .label {
  font-size: 14px;
